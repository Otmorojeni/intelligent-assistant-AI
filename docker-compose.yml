services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: cdo-postgres
    restart: unless-stopped
    command:
      - "postgres"
      - "-c"
      - "shared_buffers=256MB"
      - "-c"
      - "work_mem=8MB"
      - "-c"
      - "max_connections=40"
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-cdo_assistant}
      POSTGRES_USER: ${POSTGRES_USER:-cdo_admin}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-cdo_secure_pass_2026}
    ports:
      - "${POSTGRES_PORT:-5433}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-cdo_admin} -d ${POSTGRES_DB:-cdo_assistant}"]
      interval: 5s
      timeout: 5s
      retries: 5
    deploy:
      resources:
        limits:
          memory: 512M

  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: cdo-assistant-app
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432
      POSTGRES_DB: ${POSTGRES_DB:-cdo_assistant}
      POSTGRES_USER: ${POSTGRES_USER:-cdo_admin}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-cdo_secure_pass_2026}
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-cdo_admin}:${POSTGRES_PASSWORD:-cdo_secure_pass_2026}@postgres:5432/${POSTGRES_DB:-cdo_assistant}
      DATABASE_URL_SYNC: postgresql+psycopg://${POSTGRES_USER:-cdo_admin}:${POSTGRES_PASSWORD:-cdo_secure_pass_2026}@postgres:5432/${POSTGRES_DB:-cdo_assistant}
      OLLAMA_BASE_URL: ${OLLAMA_BASE_URL:-http://host.docker.internal:11434/v1}
      OLLAMA_MODEL: ${OLLAMA_MODEL:-qwen2.5:1.5b}
      OLLAMA_FALLBACK_MODEL: ${OLLAMA_FALLBACK_MODEL:-qwen2.5:1.5b}
      LLM_NUM_CTX: ${LLM_NUM_CTX:-2048}
      LLM_NUM_PREDICT: ${LLM_NUM_PREDICT:-450}
      LLM_NUM_THREAD: ${LLM_NUM_THREAD:-2}
      LLM_KEEP_ALIVE: ${LLM_KEEP_ALIVE:-24h}
      SECRET_KEY: ${SECRET_KEY:-cdo_hackathon_2026_jwt_secret_key_change_in_prod}
      ADMIN_DEMO_PASSWORD: ${ADMIN_DEMO_PASSWORD:-cdo-admin-2026}
    ports:
      - "${APP_PORT:-8000}:8000"
    volumes:
      - ./generated_docs:/app/generated_docs
      - ./ui:/app/ui
    deploy:
      resources:
        limits:
          memory: 768M

volumes:
  pgdata:
    driver: local
